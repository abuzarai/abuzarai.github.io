{% extends "base.html" %}
{% import "macros.html" as macros %}

{% block content %}
    <section class="block">
      <ul class="post-list">
        {% for p in section.pages %}
        <li>
          {{ macros::card(title=p.title, url=p.permalink, desc=p.description, tags=p.extra.technologies | default(value=""), tag_links=false) }}
        </li>
        {% endfor %}
      </ul>
    </section>
{% endblock content %}
