{% extends "base.html" %}

{% block wd %}~/projects/{{ page.slug }}{% endblock wd %}

{% block content %}
    <article class="post">
      <h1>{{ page.title }}</h1>
      <p class="meta">{{ page.description }}</p>
      <div class="article">
        {{ page.content | safe }}
      </div>
      <p class="plink"><a href="{{ page.extra.link }}" target="_blank" rel="noreferrer">→ visit {{ page.title }}</a></p>
      <a class="back" href="{{ get_url(path='projects/') }}">all projects</a>
    </article>
{% endblock content %}
