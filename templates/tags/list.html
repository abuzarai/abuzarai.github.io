{% extends "base.html" %}


{% block content %}
    <header class="hero">
      <p class="sub">
        All tags.
      </p>
    </header>

    <section class="block">
      {% if terms %}
      <ul class="post-list">
        {% for t in terms | sort(attribute="name") %}
        <li>
          <a class="pt" href="{{ t.permalink | safe }}">
            <span class="pd">{{ t.page_count }}</span>
            <b>#{{ t.name }}</b>
          </a>
        </li>
        {% endfor %}
      </ul>
      {% else %}
      <p class="muted">no tags yet.</p>
      {% endif %}
    </section>

    <footer class="list-foot">
      <a class="muted" href="{{ get_url(path='writings/', trailing_slash=true) }}">← writings</a>
    </footer>
{% endblock content %}
